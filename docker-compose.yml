services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: laptop
      POSTGRES_PASSWORD: laptop
      POSTGRES_DB: laptops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laptop -d laptops"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://laptop:laptop@db:5432/laptops?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
